id: bugfix-inflection-021
family: bugfix
prompt: |-
  The Python package `inflection` in this workspace has a bug. A hidden test suite fails.
  Failing tests: _hidden/test_inflection.py
  Failure message: NameError: name 'char' is not defined
  The bug is in the function `_irregular` in inflection/__init__.py, near line 108.
  Find and fix the bug with a minimal edit. The hidden tests are not in the workspace, but you can run your own checks with run_python. Call submit when you are done.
fixtures:
- copy: data/packages/inflection/inflection
  to: inflection
- patch: inflection/__init__.py
  offset: 3076
  old: plural
  new: char
allowed_tools:
- run_python
- read_file
- write_file
- edit_file
- list_dir
- submit
verifier:
  type: command
  command:
  - python
  - -m
  - pytest
  - -q
  - -p
  - no:cacheprovider
  - -o
  - addopts=
  - -rfE
  - --tb=line
  - -W
  - ignore::DeprecationWarning
  - _hidden
  hidden:
  - copy: data/packages/inflection/test_inflection.py
    to: _hidden/test_inflection.py
  timeout_s: 120
  cpu_s: 60
  mem_mb: 2048
difficulty: easy
tags:
- inflection
- wrong_variable
- __init__
timeout_s: 600
limits:
  step_limit: 15
  token_budget: 4000
reference:
  restore:
    path: inflection/__init__.py
    from: data/packages/inflection/inflection/__init__.py
metadata:
  package: inflection
  module: inflection/__init__.py
  operator: wrong_variable
  function: _irregular
  lineno: 108
  mutation: plural -> char
  failing_tests:
  - _hidden/test_inflection.py
  n_failing: 1
