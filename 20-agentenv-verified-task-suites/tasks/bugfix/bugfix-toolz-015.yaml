id: bugfix-toolz-015
family: bugfix
prompt: |-
  The Python package `toolz` in this workspace has a bug. A hidden test suite fails.
  Failing tests: _hidden/test_inspect_args.py::test_introspect_curry_valid_py3, _hidden/test_inspect_args.py::test_introspect_curry_partial_py3
  Failure message: assert...
  The bug is in the function `__signature__` in toolz/functoolz.py, near line 245.
  Find and fix the bug with a minimal edit. The hidden tests are not in the workspace, but you can run your own checks with run_python. Call submit when you are done.
fixtures:
- copy: data/packages/toolz/toolz
  to: toolz
  exclude:
  - tests
- copy: data/packages/toolz/tlz
  to: tlz
- path: toolz/_version.py
  content: |
    """Stub replacing versioneer output so imports never shell out to git."""
    def get_versions():
        return {"version": "1.0.0", "full-revisionid": None, "dirty": False, "error": None, "date": None}
- patch: toolz/functoolz.py
  offset: 6930
  old: ==
  new: '!='
allowed_tools:
- run_python
- read_file
- write_file
- edit_file
- list_dir
- submit
verifier:
  type: command
  command:
  - python
  - -m
  - pytest
  - -q
  - -p
  - no:cacheprovider
  - -o
  - addopts=
  - -rfE
  - --tb=line
  - -W
  - ignore::DeprecationWarning
  - _hidden
  hidden:
  - copy: data/packages/toolz/toolz/tests/test_functoolz.py
    to: _hidden/test_functoolz.py
  - copy: data/packages/toolz/toolz/tests/test_inspect_args.py
    to: _hidden/test_inspect_args.py
  timeout_s: 120
  cpu_s: 60
  mem_mb: 2048
difficulty: easy
tags:
- toolz
- flip_comparison
- functoolz
timeout_s: 600
limits:
  step_limit: 15
  token_budget: 4000
reference:
  restore:
    path: toolz/functoolz.py
    from: data/packages/toolz/toolz/functoolz.py
metadata:
  package: toolz
  module: toolz/functoolz.py
  operator: flip_comparison
  function: __signature__
  lineno: 245
  mutation: == -> !=
  failing_tests:
  - _hidden/test_inspect_args.py::test_introspect_curry_valid_py3
  - _hidden/test_inspect_args.py::test_introspect_curry_partial_py3
  n_failing: 2
