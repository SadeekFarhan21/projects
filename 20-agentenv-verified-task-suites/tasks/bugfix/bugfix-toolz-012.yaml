id: bugfix-toolz-012
family: bugfix
prompt: |-
  The Python package `toolz` in this workspace has a bug. A hidden test suite fails.
  Failing tests: _hidden/test_recipes.py::test_partitionby
  Failure message: TypeError: 'bool' object i...
  The bug is in the function `partitionby` in toolz/recipes.py, near line 46.
  Find and fix the bug with a minimal edit. The hidden tests are not in the workspace, but you can run your own checks with run_python. Call submit when you are done.
fixtures:
- copy: data/packages/toolz/toolz
  to: toolz
  exclude:
  - tests
- copy: data/packages/toolz/tlz
  to: tlz
- path: toolz/_version.py
  content: |
    """Stub replacing versioneer output so imports never shell out to git."""
    def get_versions():
        return {"version": "1.0.0", "full-revisionid": None, "dirty": False, "error": None, "date": None}
- patch: toolz/recipes.py
  offset: 1218
  old: '1'
  new: '0'
allowed_tools:
- run_python
- read_file
- write_file
- edit_file
- list_dir
- submit
verifier:
  type: command
  command:
  - python
  - -m
  - pytest
  - -q
  - -p
  - no:cacheprovider
  - -o
  - addopts=
  - -rfE
  - --tb=line
  - -W
  - ignore::DeprecationWarning
  - _hidden
  hidden:
  - copy: data/packages/toolz/toolz/tests/test_recipes.py
    to: _hidden/test_recipes.py
  timeout_s: 120
  cpu_s: 60
  mem_mb: 2048
difficulty: easy
tags:
- toolz
- off_by_one
- recipes
timeout_s: 600
limits:
  step_limit: 15
  token_budget: 4000
reference:
  restore:
    path: toolz/recipes.py
    from: data/packages/toolz/toolz/recipes.py
metadata:
  package: toolz
  module: toolz/recipes.py
  operator: off_by_one
  function: partitionby
  lineno: 46
  mutation: 1 -> 0
  failing_tests:
  - _hidden/test_recipes.py::test_partitionby
  n_failing: 1
