id: sql-chinook-inv_sum_year-04
family: sql
prompt: |-
  db.sqlite is the Chinook digital music store database (artists, albums, tracks, genres, playlists, customers, employees, invoices, invoice lines).
  Tables and columns
  Album(AlbumId, Title, ArtistId)
  Artist(ArtistId, Name)
  Customer(CustomerId, FirstName, LastName, Company, Address, City, State, Country, PostalCode, Phone, Fax, Email, SupportRepId)
  Employee(EmployeeId, LastName, FirstName, Title, ReportsTo, BirthDate, HireDate, Address, City, State, Country, PostalCode, Phone, Fax, Email)
  Genre(GenreId, Name)
  Invoice(InvoiceId, CustomerId, InvoiceDate, BillingAddress, BillingCity, BillingState, BillingCountry, BillingPostalCode, Total)
  InvoiceLine(InvoiceLineId, InvoiceId, TrackId, UnitPrice, Quantity)
  MediaType(MediaTypeId, Name)
  Playlist(PlaylistId, Name)
  PlaylistTrack(PlaylistId, TrackId)
  Track(TrackId, Name, AlbumId, MediaTypeId, GenreId, Composer, Milliseconds, Bytes, UnitPrice)

  Question: What is the sum of the Total column over all invoices dated in the year 2012?
  Submit only the number.
  Use run_sql to compute the answer, then call submit with the answer.
fixtures:
- copy: data/chinook.sqlite
  to: db.sqlite
allowed_tools:
- run_sql
- list_dir
- submit
verifier:
  type: python
  function: agentenv.verifiers:numeric_or_text_answer
  args:
    expected: 477.53
    kind: number
    rel_tol: 0.0001
    abs_tol: 0.01
difficulty: easy
tags:
- chinook
- sum
- date
timeout_s: 300
limits:
  step_limit: 8
  token_budget: 1500
reference:
  sql: SELECT SUM(Total) FROM Invoice WHERE strftime('%Y', InvoiceDate) = '2012'
metadata:
  template: inv_sum_year
  params:
  - '2012'
  db: chinook
  answer_kind: number
