[project]
name = "figgie-arena"
version = "0.1.0"
description = "Figgie rules engine, Bayesian and scripted bots, tournament harness and vectorized env"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pybind11>=2.13",
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
