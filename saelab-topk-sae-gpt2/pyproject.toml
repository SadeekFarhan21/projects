[project]
name = "saelab"
version = "0.1.0"
description = "Sparse autoencoders on GPT-2 small residual streams, from scratch: training, eval, auto-interp, induction attribution"
readme = "README.md"
authors = [
    { name = "Farhan Sadeek", email = "farhan@farhansadeek.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.11.2",
    "mlx-lm>=0.31.3",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformer-lens>=3.9,<4",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
