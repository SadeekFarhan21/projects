id: sql-tpch-brand_region_avg-04
family: sql
prompt: |-
  db.sqlite is a small TPC-H sample (region, nation, customer, supplier, part, partsupp, orders, lineitem). Dates are ISO strings like 1995-03-15.
  Tables and columns
  customer(c_custkey, c_name, c_address, c_nationkey, c_phone, c_acctbal, c_mktsegment, c_comment)
  lineitem(l_orderkey, l_partkey, l_suppkey, l_linenumber, l_quantity, l_extendedprice, l_discount, l_tax, l_returnflag, l_linestatus, l_shipdate, l_commitdate, l_receiptdate, l_shipinstruct, l_shipmode, l_comment)
  nation(n_nationkey, n_name, n_regionkey, n_comment)
  orders(o_orderkey, o_custkey, o_orderstatus, o_totalprice, o_orderdate, o_orderpriority, o_clerk, o_shippriority, o_comment)
  part(p_partkey, p_name, p_mfgr, p_brand, p_type, p_size, p_container, p_retailprice, p_comment)
  partsupp(ps_partkey, ps_suppkey, ps_availqty, ps_supplycost, ps_comment)
  region(r_regionkey, r_name, r_comment)
  supplier(s_suppkey, s_name, s_address, s_nationkey, s_phone, s_acctbal, s_comment)

  Question: What is the average of l_extendedprice * (1 - l_discount) over line items for parts of brand 'Brand#21' supplied by suppliers located in the region 'EUROPE'? Give at least 2 decimals.
  Submit only the number.
  Use run_sql to compute the answer, then call submit with the answer.
fixtures:
- copy: data/tpch.sqlite
  to: db.sqlite
allowed_tools:
- run_sql
- list_dir
- submit
verifier:
  type: python
  function: agentenv.verifiers:numeric_or_text_answer
  args:
    expected: 33031.83027115385
    kind: number
    rel_tol: 0.0001
    abs_tol: 0.01
difficulty: hard
tags:
- tpch
- avg
- join4
timeout_s: 300
limits:
  step_limit: 8
  token_budget: 1500
reference:
  sql: SELECT AVG(l.l_extendedprice * (1 - l.l_discount)) FROM lineitem l JOIN part p ON p.p_partkey =
    l.l_partkey JOIN supplier s ON s.s_suppkey = l.l_suppkey JOIN nation n ON n.n_nationkey = s.s_nationkey
    JOIN region r ON r.r_regionkey = n.n_regionkey WHERE p.p_brand = 'Brand#21' AND r.r_name = 'EUROPE'
metadata:
  template: brand_region_avg
  params:
  - Brand#21
  - EUROPE
  db: tpch
  answer_kind: number
