  command:
  - python
  - -m
  - pytest
  - -q
  - -p
  - no:cacheprovider
  - -o
  - addopts=
  - -rfE
  - --tb=line
  - -W
  - ignore::DeprecationWarning
  - _hidden
  hidden:
  - copy: data/packages/toolz/toolz/tests/test_dicttoolz.py
