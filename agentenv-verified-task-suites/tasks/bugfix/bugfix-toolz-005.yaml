id: bugfix-toolz-005
family: bugfix
prompt: |-
  The Python package `toolz` in this workspace has a bug. A hidden test suite fails.
  Failing tests: _hidden/test_functoolz.py, _hidden/test_inspect_args.py
  Failure message: IndexError: tuple index out of range
  Find and fix the bug with a minimal edit. The hidden tests are not in the workspace, but you can run your own checks with run_python. Call submit when you are done.
fixtures:
- copy: data/packages/toolz/toolz
  to: toolz
  exclude:
  - tests
- copy: data/packages/toolz/tlz
  to: tlz
- path: toolz/_version.py
  content: |
    """Stub replacing versioneer output so imports never shell out to git."""
    def get_versions():
        return {"version": "1.0.0", "full-revisionid": None, "dirty": False, "error": None, "date": None}
- patch: toolz/functoolz.py
  offset: 5379
  old: '0'
  new: '1'
allowed_tools:
- run_python
- read_file
- write_file
- edit_file
- list_dir
- submit
verifier:
  type: command
  command:
  - python
  - -m
  - pytest
  - -q
  - -p
  - no:cacheprovider
  - -o
  - addopts=
  - -rfE
  - --tb=line
  - -W
  - ignore::DeprecationWarning
  - _hidden
  hidden:
  - copy: data/packages/toolz/toolz/tests/test_functoolz.py
    to: _hidden/test_functoolz.py
  - copy: data/packages/toolz/toolz/tests/test_inspect_args.py
    to: _hidden/test_inspect_args.py
  timeout_s: 120
  cpu_s: 60
  mem_mb: 2048
difficulty: hard
