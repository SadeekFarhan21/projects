[project]
name = "agentenv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Farhan Sadeek", email = "farhan@farhansadeek.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.2",
    "mlx>=0.32.2",
    "mlx-lm>=0.31.3",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
