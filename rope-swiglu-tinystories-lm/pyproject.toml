[project]
name = "tfs"
version = "0.1.0"
description = "A decoder-only transformer, BPE tokenizer, trainer and KV-cached sampler written from PyTorch tensor ops"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
