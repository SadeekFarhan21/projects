[project]
name = "dtrain"
version = "0.1.0"
description = "Distributed LLM training from torch.distributed primitives: DP with bucketing, ZeRO-1, Megatron TP, GPipe PP, mixed precision, sharded checkpoints."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
