[project]
name = "qrp"
version = "0.1.0"
description = "A small, correct quant research platform: PIT parquet store, declarative features, vectorized backtester, purged walk-forward CV, run tracker"
readme = "README.md"
authors = [
    { name = "Farhan Sadeek", email = "farhan@farhansadeek.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
]

[project.scripts]
qrp = "qrp.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
