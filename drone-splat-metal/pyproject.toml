[project]
name = "drone-splat"
version = "0.1.0"
description = "3D Gaussian Splatting from COLMAP poses with a pure PyTorch tile rasterizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "scipy>=1.18.1",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
