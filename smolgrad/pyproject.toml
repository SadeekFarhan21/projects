[project]
name = "smolgrad"
version = "0.1.0"
description = "Reverse-mode autodiff and a small neural network library on top of numpy"
readme = "README.md"
authors = [
    { name = "Farhan Sadeek", email = "farhan@farhansadeek.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26"]

[dependency-groups]
# torch is only a reference oracle in tests and the benchmark baseline.
dev = ["pytest>=8", "torch>=2.4", "matplotlib>=3.8"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
