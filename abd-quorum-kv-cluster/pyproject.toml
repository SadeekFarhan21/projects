[project]
name = "kvstore"
version = "0.1.0"
description = "A sharded, quorum-replicated key-value store (v0 in Python asyncio)"
readme = "README.md"
authors = [
    { name = "Farhan Sadeek", email = "farhan@farhansadeek.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kv-node = "kvstore.node:main"
kv-cli = "kvstore.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "matplotlib>=3.8"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
