[project]
name = "az-lookahead"
version = "0.1.0"
description = "AlphaZero for Connect Four with a perfect solver and a lookahead probe"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "pybind11>=2.12",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/az"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
