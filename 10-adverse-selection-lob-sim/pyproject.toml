[project]
name = "marketsim"
version = "0.1.0"
description = "Agent-based limit order book market simulator"
readme = "README.md"
authors = [
    { name = "Farhan Sadeek", email = "farhan@farhansadeek.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
