[project]
name = "minivllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Farhan Sadeek", email = "farhan@farhansadeek.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.2",
    "torch>=2.14.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "transformers>=5.17.0",
]
