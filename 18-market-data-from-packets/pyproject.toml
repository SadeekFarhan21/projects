[project]
name = "mdpackets"
version = "0.1.0"
description = "IEX HIST TOPS and DEEP decoding, normalization to Parquet, and data-quality checks"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.2",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/mdq"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
